name: Performance test

# Fof TV: measures frame times while the remote is pressed through Home, Movies and Sports on an Android emulator
# with a generated playlist (4,000 movies, 24,000 channels). The emulator renders on the CPU (swiftshader), so the
# numbers are slower than a Fire TV in absolute terms; they are for comparing builds and finding spikes.
on:
  workflow_dispatch:
  push:
    branches: [perf-test]

# contents: write only to store the screenshots on the branch perf-shots (the log drops long lines)
permissions:
  contents: write

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FOF_VERSION_CODE: 999999
      FOF_VERSION_NAME: 9.9.9-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          # Test builds use a throwaway key (the real key exists only as a secret of the release workflow)
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storetype PKCS12 -alias t -keyalg RSA -keysize 2048 -validity 2 -storepass testpass -dname CN=test >/dev/null 2>&1
          printf 'storeFile=%s\nstorePassword=testpass\nkeyAlias=t\nkeyPassword=testpass\n' "$RUNNER_TEMP/test.jks" > keystore.properties
          # Test build only: allow the shell profiler (simpleperf) to sample the app
          sed -i 's#<application#<application xmlns:tools="http://schemas.android.com/tools"#' app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<profileable android:shell="true" /></application>#' app/src/main/AndroidManifest.xml
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk app.apk
      - name: Android Lint (report only)
        continue-on-error: true
        run: |
          ./gradlew --no-daemon -q lintRelease > /dev/null 2>&1 || true
          f=$(ls app/build/reports/lint-results-release.xml 2>/dev/null | head -1)
          [ -n "$f" ] && python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET, collections
          r = ET.parse(sys.argv[1]).getroot()
          iss = [i for i in r.iter('issue')]
          bad = [i for i in iss if i.get('severity') in ('Fatal', 'Error')]
          print("LINT", len(iss), "issues,", len(bad), "errors")
          c = collections.Counter(i.get('id') for i in iss)
          print("LINT top:", ", ".join(f"{k} {v}" for k, v in c.most_common(25)))
          for i in bad[:40]:
              loc = i.find('location')
              print("LINT ERR", i.get('id'), (loc.get('file').split('/java/')[-1] + ':' + str(loc.get('line'))) if loc is not None else '', '-', i.get('message')[:160])
          PY
      - name: Avatar tiles draw
        run: |
          if ./gradlew --no-daemon -q testDebugUnitTest --tests 'com.ipvio.stream.AvatarTilesTest'; then echo "CHECK PASS 34 avatars bundled" | tee avatars.txt; else echo "CHECK FAIL avatar tiles" | tee avatars.txt; exit 1; fi
      - name: Generate test playlist and serve it
        run: |
          mkdir -p srv
          python3 - <<'PY'
          import random
          random.seed(7)
          words = "Night Storm River City Shadow Last Silent Red Lost Iron Golden Broken Dark Wild Hidden Final Black Blue Empire Garden".split()
          out = ['#EXTM3U url-tvg="http://10.0.2.2:8000/epg.xml"']
          # Real-world shape of the maintainer's provider: 23,773 channels named like "US: TNT East", groups like
          # "USA | Sports", plus a large movie and series catalog the app must skip (provider used for live TV only)
          named = ["US: TNT East", "US: TNT West", "US: TBS (East) HD", "US: TBS (West)", "US: truTV East", "US: ESPN", "US: ESPN2",
                   "US: ESPNU", "US: ESPNews", "US: NBA TV", "US: Universo", "US: Telemundo East", "US: FOX Sports 1", "US: CBS Sports Network",
                   "US: USA Network East", "US: NBC", "US: ABC", "US: CBS", "US: FOX", "US: Peacock Event 01", "US: beIN Sports"]
          groups = ["USA | Sports ⚽", "USA | Entertainment 📺", "USA | News", "USA | Documentary 📺", "UK | Sports", "Music", "Relaxation 🌴"]
          for i in range(23773):
              name = named[i] if i < len(named) else f"{random.choice(['US','UK','CA'])}: Channel {i}"
              grp = "USA | Sports ⚽" if i < len(named) else random.choice(groups)
              out.append(f'#EXTINF:-1 tvg-id="ch{i}" tvg-logo="" group-title="{grp}",{name}')
              out.append(f"http://10.0.2.2:8000/live/{i}.ts")
          for i in range(20000):
              t = " ".join(random.sample(words, 2)) + f" {i}"
              out.append(f'#EXTINF:-1 group-title="Series | Drama",{t} S01 E{(i % 10) + 1:02d}')
              out.append(f"http://10.0.2.2:8000/series/{i}.mkv")
          for i in range(100000):
              t = " ".join(random.sample(words, 2)) + f" {i}"
              out.append(f'#EXTINF:-1 group-title="{random.choice(["Action","Drama","Comedy","Thriller","Family"])}",{t} ({random.randint(1980,2026)})')
              out.append(f"http://10.0.2.2:8000/movie/{i}.mp4")
          open("srv/test.m3u","w").write("\n".join(out)+"\n")
          # TV guide at real scale: 24,000 channels x 10 shows (searching it crashed the app on a big guide)
          import datetime
          t0 = datetime.datetime.utcnow().replace(minute=0, second=0, microsecond=0) - datetime.timedelta(hours=1)
          with open("srv/epg.xml", "w") as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n')
              for i in range(24000):
                  f.write(f'<channel id="ch{i}"><display-name>Channel {i}</display-name></channel>\n')
              for i in range(24000):
                  for k in range(10):
                      a = (t0 + datetime.timedelta(hours=k)).strftime("%Y%m%d%H%M%S +0000")
                      b = (t0 + datetime.timedelta(hours=k + 1)).strftime("%Y%m%d%H%M%S +0000")
                      title = " ".join(random.sample(words, 2)) + (" Lakers" if (i + k) % 997 == 0 else "")
                      f.write(f'<programme start="{a}" stop="{b}" channel="ch{i}"><title>{title}</title><desc>Show {k}</desc></programme>\n')
              f.write("</tv>\n")
          PY
          (cd srv && nohup python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2; curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8000/test.m3u
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run and measure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          disable-animations: false
          # A Fire TV Stick class device: 2 GB of memory, small app heap
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb root || true
            sleep 3
            adb wait-for-device
            adb shell setprop security.perf_harden 0 || true
            echo "perf_harden=$(adb shell getprop security.perf_harden)"
            adb install -r app.apk
            adb shell am start -W -n com.fof.tv/com.ipvio.stream.MainActivity --es fof_test_playlist http://10.0.2.2:8000/test.m3u | tee start.txt
            sleep 60
            # The emulator's network to the test server is sometimes not up yet: ask again once if the list did not load
            if ! adb logcat -d -s FofProfile | grep -q "playlist: ready"; then echo "playlist not loaded yet, asking again"; adb shell am force-stop com.fof.tv; sleep 2; adb shell am start -W -n com.fof.tv/com.ipvio.stream.MainActivity --es fof_test_playlist http://10.0.2.2:8000/test.m3u; sleep 60; fi
            adb logcat -d -s FofProfile | grep "playlist: ready" | head -1 > playlist_ready.txt || true
            # Who's watching screen and the avatar gallery (hold OK)
            adb exec-out screencap -p > p_profiles.png
            adb shell input keyevent --longpress 23
            sleep 5
            adb exec-out screencap -p > p_avatars.png
            adb shell input keyevent 4
            sleep 2
            adb shell input keyevent 23
            sleep 40
            adb exec-out screencap -p > p0_start.png
            adb shell uiautomator dump /sdcard/ui0.xml >/dev/null 2>&1; adb pull /sdcard/ui0.xml ui0.xml >/dev/null 2>&1
            echo "== screen texts after start"; grep -o 'text="[^"]\+"' ui0.xml | head -40 || true
            adb shell dumpsys gfxinfo com.fof.tv reset > /dev/null
            adb shell am broadcast -a com.fof.tv.PROFILE --ei ms 13000 --es tag home
            sleep 1
            adb shell 'for i in 1 2 3; do input keyevent 20; sleep 0.6; done'
            adb shell 'for i in $(seq 1 25); do input keyevent 22; sleep 0.15; done'
            adb exec-out screencap -p > p1_home_right.png
            adb shell uiautomator dump /sdcard/ui1.xml >/dev/null 2>&1; adb pull /sdcard/ui1.xml ui1.xml >/dev/null 2>&1
            echo "== screen texts after Right x25"; grep -o 'text="[^"]\+"' ui1.xml | head -30 || true
            adb shell 'for i in $(seq 1 6); do input keyevent 20; sleep 0.4; done'
            adb shell 'for i in $(seq 1 6); do input keyevent 19; sleep 0.4; done'
            adb exec-out screencap -p > p2_home_updown.png
            adb shell dumpsys gfxinfo com.fof.tv > gfx_home.txt
            sleep 4
            adb shell dumpsys gfxinfo com.fof.tv reset > /dev/null
            adb shell am broadcast -a com.fof.tv.PROFILE --ei ms 5000 --es tag detail
            sleep 1
            adb shell 'input keyevent 22; sleep 1'
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml home-before-open | tee -a journey.txt
            adb shell 'input keyevent 23; sleep 3'
            sleep 2
            adb exec-out screencap -p > p3_detail.png
            adb shell uiautomator dump /sdcard/ui3.xml >/dev/null 2>&1; adb pull /sdcard/ui3.xml ui3.xml >/dev/null 2>&1
            echo "== screen texts on the title page"; grep -o 'text="[^"]\+"' ui3.xml | head -30 || true
            adb logcat -d | grep -iE "PlaylistStore|fof|AndroidRuntime" | tail -20 || true
            adb shell 'input keyevent 4; sleep 2'
            adb exec-out screencap -p > p4_back.png
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml home-after-back | tee -a journey.txt
            adb shell dumpsys gfxinfo com.fof.tv > gfx_detail.txt
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4
            sleep 4
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4 --es q l
            sleep 1
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4 --es q la
            sleep 1
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4 --es q lak
            sleep 1
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4 --es q lakers
            sleep 12
            adb exec-out screencap -p > p_search.png
            adb shell uiautomator dump /sdcard/s.xml >/dev/null 2>&1; adb pull /sdcard/s.xml s.xml >/dev/null 2>&1; python3 .github/scripts/focused.py s.xml search-lakers "On TV,Lakers,Games,Teams" | tee -a journey.txt
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4 --es q denzel
            sleep 12
            adb shell uiautomator dump /sdcard/s.xml >/dev/null 2>&1; adb pull /sdcard/s.xml s.xml >/dev/null 2>&1; python3 .github/scripts/focused.py s.xml search-denzel "Movies,Denzel Washington" | tee -a journey.txt
            adb shell 'for q in s st sto stor storm th the "the n" e er re r ri riv river; do am broadcast -a com.fof.tv.TAB --ei tab 4 --es q "$q" >/dev/null; sleep 0.3; done'
            sleep 10
            adb shell uiautomator dump /sdcard/s.xml >/dev/null 2>&1; adb pull /sdcard/s.xml s.xml >/dev/null 2>&1; python3 .github/scripts/focused.py s.xml search-fast-typing "Storm,River" | tee -a journey.txt
            adb shell dumpsys meminfo com.fof.tv | grep -E "TOTAL|Java Heap|Native Heap" | head -4 | tee -a journey.txt
            adb shell input keyevent 22
            sleep 2
            (adb shell pidof com.fof.tv > /dev/null && echo "search: app still running" || echo "search: APP CLOSED") | tee -a journey.txt
            adb logcat -d -b crash > crash_search.txt; adb logcat -d | grep -B2 -A40 "FATAL EXCEPTION" | head -80 >> crash_search.txt
            adb shell am start -n com.fof.tv/com.ipvio.stream.MainActivity
            sleep 8
            adb shell input keyevent 23
            sleep 6
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 10
            sleep 12
            adb shell 'input keyevent 20; sleep 1; input keyevent 20; sleep 1; input keyevent 22; sleep 1'
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml sports-before-open | tee -a journey.txt
            adb exec-out screencap -p > p5_sports.png
            adb shell 'input keyevent 23; sleep 3'
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml sports-page-opened | tee -a journey.txt
            adb shell 'input keyevent 4; sleep 3'
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml sports-after-back | tee -a journey.txt
            adb shell 'input keyevent 4; sleep 2'
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml sports-after-second-back | tee -a journey.txt
            # Live TV opens like TiviMate (guide over the playing channel); the app must stay up
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 3
            sleep 10
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml livetv-guide "USA | Sports" | tee -a journey.txt
            adb exec-out screencap -p > p7_livetv.png
            (adb shell pidof com.fof.tv > /dev/null && echo "livetv: app still running" || echo "livetv: APP CLOSED") | tee -a journey.txt
            adb shell 'input keyevent 4; sleep 2; input keyevent 4; sleep 2'
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 5
            sleep 6
            adb exec-out screencap -p > p8_settings.png
            adb shell 'for i in 1 2 3 4 5 6; do input keyevent 20; sleep 0.5; done'
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 10
            sleep 8
            adb exec-out screencap -p > p9_sports_again.png
            # Audit: every other screen once (Movies, Shows, TV guide, Favorites, My list, History), the sports tabs and a
            # settings page; the app must stay up, nothing may freeze, and each screen goes into the report
            adb shell 'for t in 1 2 6 7 8 9; do am broadcast -a com.fof.tv.TAB --ei tab $t >/dev/null; sleep 7; screencap -p /sdcard/p_tab$t.png; input keyevent 4; sleep 2; done'
            for t in 1 2 6 7 8 9; do adb pull /sdcard/p_tab$t.png p_tab$t.png >/dev/null 2>&1; done
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 10 >/dev/null; sleep 8
            adb shell 'for k in 1 2 3; do input keyevent 22; sleep 0.6; input keyevent 23; sleep 6; screencap -p /sdcard/p_sport$k.png; done'
            for k in 1 2 3; do adb pull /sdcard/p_sport$k.png p_sport$k.png >/dev/null 2>&1; done
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 5 >/dev/null; sleep 5
            adb shell 'input keyevent 20; sleep 0.5; input keyevent 23'; sleep 4; adb exec-out screencap -p > p_settings_page.png
            (adb shell pidof com.fof.tv > /dev/null && echo "allscreens: app still running" || echo "allscreens: APP CLOSED") | tee -a journey.txt
            adb logcat -d -s FofProfile FofFreeze FofUntranslated > marks.txt
            adb shell dumpsys meminfo com.fof.tv | head -40 > meminfo.txt
            adb logcat -c
            adb shell am force-stop com.fof.tv
            sleep 2
            adb shell am start -W -n com.fof.tv/com.ipvio.stream.MainActivity --ei fof_profile_start 9000 | tee cold.txt
            sleep 2
            adb shell input keyevent 23
            sleep 12
            adb exec-out screencap -p > p6_cold.png
            adb logcat -d -s FofProfile > cold_profile.txt
            adb shell am start -W -n com.fof.tv/com.ipvio.stream.MainActivity | tee warm.txt
            adb logcat -d > logcat.txt
            (adb shell pidof com.fof.tv && echo RUNNING || echo NOT-RUNNING) | tee alive.txt
      - name: Summary
        if: always()
        run: |
          for f in gfx_home.txt gfx_detail.txt; do echo "== $f"; grep -E "Total frames rendered|Janky frames|50th percentile|90th percentile|95th percentile|99th percentile|Slow UI thread|Frame deadline missed" $f || true; done
          grep -E "TOTAL" meminfo.txt | head -3 || true
          echo "== journey"; cat journey.txt 2>/dev/null || true
          echo "== search crash log"; head -80 crash_search.txt 2>/dev/null || true
          echo "== cold start"; grep -E "TotalTime|WaitTime" cold.txt || true; echo "== warm start"; grep -E "TotalTime|WaitTime" warm.txt || true
          echo "== cold start main thread"; sed 's/^.*FofProfile: //' cold_profile.txt | head -120 || true
          echo "== main thread samples"; grep "FofProfile" logcat.txt | sed 's/^.*FofProfile: //' || true
          grep -n "FATAL EXCEPTION" -A20 logcat.txt | head -40 || true
          # Pass/fail checks: a build that fails any of them is not released
          {
            n=$(grep -o "index ready ([0-9]* titles)" marks.txt | head -1 | grep -o "[0-9]*")
            if [ -n "$n" ] && [ "$n" -lt 30000 ]; then echo "CHECK PASS provider movies/series skipped ($n titles)"; else echo "CHECK FAIL provider movies/series skipped (${n:-no index})"; fi
            if grep -q "FofFreeze" marks.txt logcat.txt 2>/dev/null; then echo "CHECK FAIL no frozen screen: $(grep -h FofFreeze marks.txt logcat.txt | head -2)"; else echo "CHECK PASS no frozen screen"; fi
            if grep -q "APP CLOSED" journey.txt; then echo "CHECK FAIL app stays open (search, Live TV, every screen)"; else echo "CHECK PASS app stays open (search, Live TV, every screen)"; fi
            if grep -q "FATAL EXCEPTION" logcat.txt crash_search.txt 2>/dev/null; then echo "CHECK FAIL no crash"; else echo "CHECK PASS no crash"; fi
            fp=$(grep -o "first poster card composed after [0-9]* ms" cold_profile.txt logcat.txt 2>/dev/null | head -1 | grep -o "[0-9]* ms" | grep -o "[0-9]*")
            if [ -n "$fp" ] && [ "$fp" -lt 15000 ]; then echo "CHECK PASS home posters after restart ($fp ms)"; else echo "CHECK FAIL home posters after restart (${fp:-none} ms)"; fi
            grep -q "HAS\[livetv-guide\] USA | Sports: yes" journey.txt && echo "CHECK PASS Live TV guide shows categories" || echo "CHECK FAIL Live TV guide shows categories"
            [ -s playlist_ready.txt ] && echo "CHECK PASS playlist loaded" || echo "CHECK FAIL playlist loaded"
            # Smoothness while scrolling Home (frames held up by the app's own work, not by the emulator's slow drawing)
            tot=$(grep -o "Total frames rendered: [0-9]*" gfx_home.txt | grep -o "[0-9]*$"); slow=$(grep -o "Number Slow UI thread: [0-9]*" gfx_home.txt | grep -o "[0-9]*$")
            if [ -n "$tot" ] && [ "$tot" -gt 0 ] && [ $((slow * 100 / tot)) -lt 60 ]; then echo "CHECK PASS smooth Home scrolling ($slow of $tot frames slow in the app)"; else echo "CHECK FAIL smooth Home scrolling (${slow:-?} of ${tot:-?} frames slow in the app)"; fi
            grep -q "HAS\[search-denzel\] Denzel Washington: yes" journey.txt && echo "CHECK PASS search finds a person" || echo "CHECK FAIL search finds a person"
          } | tee checks.txt
          echo "== sports and search timings"; grep -E "sports:|search:|first poster|profile picked" marks.txt | sed 's/^.*FofProfile: //' || true
          grep -q RUNNING alive.txt && ! grep -q NOT-RUNNING alive.txt && ! grep -q "CHECK FAIL" checks.txt
      - name: Key rotation signing works (throwaway keys)
        if: always()
        run: |
          cd "$RUNNER_TEMP" && rm -f o.jks n.jks lin.bin r.apk
          keytool -genkeypair -keystore o.jks -storetype PKCS12 -alias o -keyalg RSA -keysize 2048 -validity 2 -storepass oldpass -dname CN=o >/dev/null 2>&1
          keytool -genkeypair -keystore n.jks -storetype PKCS12 -alias n -keyalg RSA -keysize 2048 -validity 2 -storepass newpass -dname CN=n >/dev/null 2>&1
          export OLD_PASS=oldpass NEW_PASS=newpass
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          APK=$(ls "$GITHUB_WORKSPACE"/app/build/outputs/apk/release/*.apk | head -1)
          "$AS" rotate --out lin.bin --old-signer --ks o.jks --ks-key-alias o --ks-pass env:OLD_PASS --set-rollback false --new-signer --ks n.jks --ks-key-alias n --ks-pass env:NEW_PASS
          "$AS" sign --lineage lin.bin --rotation-min-sdk-version 28 --ks o.jks --ks-key-alias o --ks-pass env:OLD_PASS --next-signer --ks n.jks --ks-key-alias n --ks-pass env:NEW_PASS --out r.apk "$APK"
          if "$AS" verify -v --print-certs r.apk | tee verify.txt | grep -q "CN=n"; then echo "CHECK PASS key rotation signing" | tee -a "$GITHUB_WORKSPACE/checks.txt"; else cat verify.txt | head -30; echo "CHECK FAIL key rotation signing" | tee -a "$GITHUB_WORKSPACE/checks.txt"; fi
      - name: Screens and texts
        if: always()
        run: |
          echo "== German text without translation"; grep FofUntranslated marks.txt | sed 's/^.*FofUntranslated: //' | sort -u | head -80 || true
          # Screens as small JPEGs in the log (artifacts cannot be downloaded from here): between ==IMG name and the end of line
          which convert >/dev/null || sudo apt-get install -y -qq imagemagick >/dev/null
          for f in p_tab1.png p_tab2.png p_tab6.png p_tab7.png p_tab8.png p_tab9.png p_sport1.png p_sport2.png p_sport3.png p_settings_page.png p_profiles.png p_avatars.png p0_start.png p_search.png p5_sports.png p7_livetv.png p8_settings.png p9_sports_again.png p3_detail.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 960x -quality 55 "${f%.png}.jpg" && echo "==IMG ${f%.png} $(base64 -w0 "${f%.png}.jpg")"
          done
          echo "== checks again"; cat checks.txt 2>/dev/null || true
      - name: Store screenshots (branch perf-shots)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"; cp *.jpg checks.txt "$RUNNER_TEMP/shots/" 2>/dev/null || true
          cd "$RUNNER_TEMP/shots" && git init -q && git checkout -q -b perf-shots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screens of run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" perf-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-test
          path: |
            *.png
            gfx_*.txt
            prof_*.txt
            meminfo.txt
            start.txt
