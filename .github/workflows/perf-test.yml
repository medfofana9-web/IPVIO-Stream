name: Performance test

# Fof TV: measures frame times while the remote is pressed through Home, Movies and Sports on an Android emulator
# with a generated playlist (4,000 movies, 24,000 channels). The emulator renders on the CPU (swiftshader), so the
# numbers are slower than a Fire TV in absolute terms; they are for comparing builds and finding spikes.
on:
  workflow_dispatch:
  push:
    branches: [perf-test]

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FOF_VERSION_CODE: 999999
      FOF_VERSION_NAME: 9.9.9-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          printf 'storeFile=signing/fof-tv.jks\nstorePassword=foftv-sign\nkeyAlias=foftv\nkeyPassword=foftv-sign\n' > keystore.properties
          # Test build only: allow the shell profiler (simpleperf) to sample the app
          sed -i 's#<application#<application xmlns:tools="http://schemas.android.com/tools"#' app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<profileable android:shell="true" /></application>#' app/src/main/AndroidManifest.xml
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk app.apk
      - name: Generate test playlist and serve it
        run: |
          mkdir -p srv
          python3 - <<'PY'
          import random
          random.seed(7)
          words = "Night Storm River City Shadow Last Silent Red Lost Iron Golden Broken Dark Wild Hidden Final Black Blue Empire Garden".split()
          out = ['#EXTM3U url-tvg="http://10.0.2.2:8000/epg.xml"']
          # Real-world size: about 24,000 live channels (the maintainer's provider has 23,773)
          for i in range(24000):
              out.append(f'#EXTINF:-1 tvg-id="ch{i}" group-title="{random.choice(["News","Sports","Kids","Movies HD","Music"])}",Channel {i}')
              out.append(f"http://10.0.2.2:8000/live/{i}.ts")
          for i in range(40000):
              t = " ".join(random.sample(words, 2)) + f" {i}"
              out.append(f'#EXTINF:-1 group-title="{random.choice(["Action","Drama","Comedy","Thriller","Family"])}",{t} ({random.randint(1980,2026)})')
              out.append(f"http://10.0.2.2:8000/movie/{i}.mp4")
          open("srv/test.m3u","w").write("\n".join(out)+"\n")
          # TV guide at real scale: 24,000 channels x 10 shows (searching it crashed the app on a big guide)
          import datetime
          t0 = datetime.datetime.utcnow().replace(minute=0, second=0, microsecond=0) - datetime.timedelta(hours=1)
          with open("srv/epg.xml", "w") as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n<tv>\n')
              for i in range(24000):
                  f.write(f'<channel id="ch{i}"><display-name>Channel {i}</display-name></channel>\n')
              for i in range(24000):
                  for k in range(10):
                      a = (t0 + datetime.timedelta(hours=k)).strftime("%Y%m%d%H%M%S +0000")
                      b = (t0 + datetime.timedelta(hours=k + 1)).strftime("%Y%m%d%H%M%S +0000")
                      title = " ".join(random.sample(words, 2)) + (" Lakers" if (i + k) % 997 == 0 else "")
                      f.write(f'<programme start="{a}" stop="{b}" channel="ch{i}"><title>{title}</title><desc>Show {k}</desc></programme>\n')
              f.write("</tv>\n")
          PY
          (cd srv && nohup python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2; curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8000/test.m3u
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run and measure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb root || true
            sleep 3
            adb wait-for-device
            adb shell setprop security.perf_harden 0 || true
            echo "perf_harden=$(adb shell getprop security.perf_harden)"
            adb install -r app.apk
            adb shell am start -W -n com.fof.tv/com.ipvio.stream.MainActivity --es fof_test_playlist http://10.0.2.2:8000/test.m3u | tee start.txt
            sleep 60
            adb shell input keyevent 23
            sleep 40
            adb exec-out screencap -p > p0_start.png
            adb shell uiautomator dump /sdcard/ui0.xml >/dev/null 2>&1; adb pull /sdcard/ui0.xml ui0.xml >/dev/null 2>&1
            echo "== screen texts after start"; grep -o 'text="[^"]\+"' ui0.xml | head -40 || true
            adb shell dumpsys gfxinfo com.fof.tv reset > /dev/null
            adb shell am broadcast -a com.fof.tv.PROFILE --ei ms 13000 --es tag home
            sleep 1
            adb shell 'for i in 1 2 3; do input keyevent 20; sleep 0.6; done'
            adb shell 'for i in $(seq 1 25); do input keyevent 22; sleep 0.15; done'
            adb exec-out screencap -p > p1_home_right.png
            adb shell uiautomator dump /sdcard/ui1.xml >/dev/null 2>&1; adb pull /sdcard/ui1.xml ui1.xml >/dev/null 2>&1
            echo "== screen texts after Right x25"; grep -o 'text="[^"]\+"' ui1.xml | head -30 || true
            adb shell 'for i in $(seq 1 6); do input keyevent 20; sleep 0.4; done'
            adb shell 'for i in $(seq 1 6); do input keyevent 19; sleep 0.4; done'
            adb exec-out screencap -p > p2_home_updown.png
            adb shell dumpsys gfxinfo com.fof.tv > gfx_home.txt
            sleep 4
            adb shell dumpsys gfxinfo com.fof.tv reset > /dev/null
            adb shell am broadcast -a com.fof.tv.PROFILE --ei ms 5000 --es tag detail
            sleep 1
            adb shell 'input keyevent 22; sleep 1'
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml home-before-open | tee -a journey.txt
            adb shell 'input keyevent 23; sleep 3'
            sleep 2
            adb exec-out screencap -p > p3_detail.png
            adb shell uiautomator dump /sdcard/ui3.xml >/dev/null 2>&1; adb pull /sdcard/ui3.xml ui3.xml >/dev/null 2>&1
            echo "== screen texts on the title page"; grep -o 'text="[^"]\+"' ui3.xml | head -30 || true
            adb logcat -d | grep -iE "PlaylistStore|fof|AndroidRuntime" | tail -20 || true
            adb shell 'input keyevent 4; sleep 2'
            adb exec-out screencap -p > p4_back.png
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml home-after-back | tee -a journey.txt
            adb shell dumpsys gfxinfo com.fof.tv > gfx_detail.txt
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4
            sleep 4
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4 --es q l
            sleep 1
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4 --es q la
            sleep 1
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4 --es q lak
            sleep 1
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4 --es q lakers
            sleep 12
            adb exec-out screencap -p > p_search.png
            adb shell uiautomator dump /sdcard/s.xml >/dev/null 2>&1; adb pull /sdcard/s.xml s.xml >/dev/null 2>&1; python3 .github/scripts/focused.py s.xml search-lakers "On TV,Lakers,Games,Teams" | tee -a journey.txt
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 4 --es q denzel
            sleep 12
            adb shell uiautomator dump /sdcard/s.xml >/dev/null 2>&1; adb pull /sdcard/s.xml s.xml >/dev/null 2>&1; python3 .github/scripts/focused.py s.xml search-denzel "Movies,Denzel Washington" | tee -a journey.txt
            adb shell 'for q in s st sto stor storm th the "the n" e er re r ri riv river; do am broadcast -a com.fof.tv.TAB --ei tab 4 --es q "$q" >/dev/null; sleep 0.3; done'
            sleep 10
            adb shell uiautomator dump /sdcard/s.xml >/dev/null 2>&1; adb pull /sdcard/s.xml s.xml >/dev/null 2>&1; python3 .github/scripts/focused.py s.xml search-fast-typing "Storm,River" | tee -a journey.txt
            adb shell dumpsys meminfo com.fof.tv | grep -E "TOTAL|Java Heap|Native Heap" | head -4 | tee -a journey.txt
            adb shell input keyevent 22
            sleep 2
            (adb shell pidof com.fof.tv > /dev/null && echo "search: app still running" || echo "search: APP CLOSED") | tee -a journey.txt
            adb logcat -d -b crash > crash_search.txt; adb logcat -d | grep -B2 -A40 "FATAL EXCEPTION" | head -80 >> crash_search.txt
            adb shell am start -n com.fof.tv/com.ipvio.stream.MainActivity
            sleep 8
            adb shell input keyevent 23
            sleep 6
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 10
            sleep 12
            adb shell 'input keyevent 20; sleep 1; input keyevent 20; sleep 1; input keyevent 22; sleep 1'
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml sports-before-open | tee -a journey.txt
            adb exec-out screencap -p > p5_sports.png
            adb shell 'input keyevent 23; sleep 3'
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml sports-page-opened | tee -a journey.txt
            adb shell 'input keyevent 4; sleep 3'
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml sports-after-back | tee -a journey.txt
            adb shell 'input keyevent 4; sleep 2'
            adb shell uiautomator dump /sdcard/f.xml >/dev/null 2>&1; adb pull /sdcard/f.xml f.xml >/dev/null 2>&1; python3 .github/scripts/focused.py f.xml sports-after-second-back | tee -a journey.txt
            adb shell dumpsys meminfo com.fof.tv | head -40 > meminfo.txt
            adb logcat -c
            adb shell am force-stop com.fof.tv
            sleep 2
            adb shell am start -W -n com.fof.tv/com.ipvio.stream.MainActivity --ei fof_profile_start 9000 | tee cold.txt
            sleep 2
            adb shell input keyevent 23
            sleep 12
            adb exec-out screencap -p > p6_cold.png
            adb logcat -d -s FofProfile > cold_profile.txt
            adb shell am start -W -n com.fof.tv/com.ipvio.stream.MainActivity | tee warm.txt
            adb logcat -d > logcat.txt
            (adb shell pidof com.fof.tv && echo RUNNING || echo NOT-RUNNING) | tee alive.txt
      - name: Summary
        if: always()
        run: |
          for f in gfx_home.txt gfx_detail.txt; do echo "== $f"; grep -E "Total frames rendered|Janky frames|50th percentile|90th percentile|95th percentile|99th percentile|Slow UI thread|Frame deadline missed" $f || true; done
          grep -E "TOTAL" meminfo.txt | head -3 || true
          echo "== journey"; cat journey.txt 2>/dev/null || true
          echo "== search crash log"; head -80 crash_search.txt 2>/dev/null || true
          echo "== cold start"; grep -E "TotalTime|WaitTime" cold.txt || true; echo "== warm start"; grep -E "TotalTime|WaitTime" warm.txt || true
          echo "== cold start main thread"; sed 's/^.*FofProfile: //' cold_profile.txt | head -120 || true
          echo "== main thread samples"; grep "FofProfile" logcat.txt | sed 's/^.*FofProfile: //' || true
          grep -n "FATAL EXCEPTION" -A20 logcat.txt | head -40 || true
          grep -q RUNNING alive.txt && ! grep -q NOT-RUNNING alive.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-test
          path: |
            *.png
            gfx_*.txt
            prof_*.txt
            meminfo.txt
            start.txt
