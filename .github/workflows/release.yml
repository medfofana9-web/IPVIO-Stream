name: Release Fof TV

# Every push to main builds a signed APK and publishes it as a prerelease (early channel).
# promote.yml makes it the latest release after 24 hours.
# Fire TV: Downloader → https://github.com/medfofana9-web/IPVIO-Stream/releases/latest/download/FofTV.apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FOF_VERSION_CODE: ${{ github.run_number }}0
      FOF_VERSION_NAME: 1.3.${{ github.run_number }}
      # Optimized build (smaller, faster start); verified by the "Launch test" workflow on an emulator
      FOF_R8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing config
        env:
          FOF_SIGNING: ${{ secrets.FOF_SIGNING }}
        run: |
          chmod +x gradlew
          if [ -z "$FOF_SIGNING" ]; then echo "::error::Repository secret FOF_SIGNING is missing (signing key)"; exit 1; fi
          umask 077; mkdir -p "$RUNNER_TEMP/k"; echo "$FOF_SIGNING" | tr -d ' \r\n' | base64 -d | tar xz -C "$RUNNER_TEMP/k"
          . "$RUNNER_TEMP/k/sign.env"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/k/old.jks" "$OLD_PASS" "$OLD_ALIAS" "$OLD_PASS" > keystore.properties
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk FofTV.apk
      # R8 renames classes and lines: keep the map so crash and freeze reports of this build can be read
      - name: Keep the R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 90
      - name: Sign with the private key (key rotation)
        # FOF_SIGNING (repository secret) holds the old and the new key. Android 9+ moves to the new key through a
        # signing lineage, so installed apps update without a reinstall; the old key can no longer sign updates for them
        # (rollback off). Older Android versions keep the old signature. Without the secret the APK stays as built.
        env:
          FOF_SIGNING: ${{ secrets.FOF_SIGNING }}
        run: |
          set -a; . "$RUNNER_TEMP/k/sign.env"; set +a
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$AS" rotate --out "$RUNNER_TEMP/k/lineage.bin" \
            --old-signer --ks "$RUNNER_TEMP/k/old.jks" --ks-key-alias "$OLD_ALIAS" --ks-pass env:OLD_PASS --set-rollback false \
            --new-signer --ks "$RUNNER_TEMP/k/new.jks" --ks-key-alias "$NEW_ALIAS" --ks-pass env:NEW_PASS
          "$AS" sign --lineage "$RUNNER_TEMP/k/lineage.bin" --rotation-min-sdk-version 28 \
            --ks "$RUNNER_TEMP/k/old.jks" --ks-key-alias "$OLD_ALIAS" --ks-pass env:OLD_PASS \
            --next-signer --ks "$RUNNER_TEMP/k/new.jks" --ks-key-alias "$NEW_ALIAS" --ks-pass env:NEW_PASS \
            --out FofTV-signed.apk FofTV.apk
          "$AS" verify --print-certs FofTV-signed.apk | grep -i "certificate DN" | sed 's/^/Signed: /' 
          mv FofTV-signed.apk FofTV.apk
      - name: Remove keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/k" keystore.properties
      - name: Release notes
        # The update dialog shows these: the first line of the commit message, in plain words (no build hashes)
        run: git log -1 --format=%s | cut -c1-300 > notes.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: Fof TV 1.3.${{ github.run_number }}
          body_path: notes.txt
          prerelease: true
          make_latest: false
          files: FofTV.apk
