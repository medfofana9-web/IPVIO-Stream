name: Playback test

# Movies, episodes and live channels on an Android TV emulator against sources that misbehave the way real ones did (.github/scripts/playback_fixture.py):
# a server that cannot seek, an expired link (403), a server that sends nothing, an addon that answers late, and a
# remembered source that fails before the other addons answered. Each scenario resumes a movie at 1:00 through the same
# path as Continue watching; every one must show a picture near that spot. Live: a channel plays, a channel whose
# connection keeps dropping keeps playing, and quick Up/Down zapping ends on a playing channel
# (.github/scripts/playback_check.py).
# Runs on every push to main and auto-fix that changes the app; promote.yml only promotes a build whose app commit passed.
# Emulator timings only; they do not stand in for an onn 4K or a Fire TV Stick.
on:
  push:
    branches: [ main, auto-fix ]
    paths: [ 'app/**', '.github/scripts/playback_*', '.github/workflows/playback-test.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playback-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FOF_R8: "1"
      FOF_VERSION_CODE: 999999
      FOF_VERSION_NAME: 9.9.9-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK (test name, throwaway key)
        run: |
          chmod +x gradlew
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storetype PKCS12 -alias t -keyalg RSA -keysize 2048 -validity 2 -storepass testpass -dname CN=test >/dev/null 2>&1
          printf 'storeFile=%s\nstorePassword=testpass\nkeyAlias=t\nkeyPassword=testpass\n' "$RUNNER_TEMP/test.jks" > keystore.properties
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk app.apk
      - name: Fixture (movie, misbehaving sources, two addons)
        run: |
          mkdir -p srv
          which ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440 -t 180 \
            -c:v libx264 -preset veryfast -b:v 800k -pix_fmt yuv420p -c:a aac -movflags +faststart srv/movie.mp4
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=330 -t 180 \
            -c:v libx264 -preset veryfast -b:v 800k -g 25 -pix_fmt yuv420p -c:a aac -f mpegts srv/live.ts
          python3 .github/scripts/playback_fixture.py m3u > srv/test.m3u
          (cd srv && nohup python3 -m http.server 8000 >/dev/null 2>&1 &)
          nohup python3 .github/scripts/playback_fixture.py > fixture.log 2>&1 &
          python3 .github/scripts/playback_fixture.py json > fixture.json
          sleep 2; curl -s -o /dev/null -w "addon %{http_code}\n" http://127.0.0.1:8002/a/manifest.json
          python3 .github/scripts/playback_steps.py fixture.json > scenarios.sh
          cat scenarios.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Resume each movie
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          disable-animations: true
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            adb install -r app.apk
            adb logcat -c
            adb shell am start -W -n com.fof.tv/com.ipvio.stream.MainActivity --es fof_test_playlist http://10.0.2.2:8000/test.m3u
            sleep 45
            adb shell input keyevent 23; sleep 3; adb shell input keyevent 4; sleep 2
            adb shell input keyevent 20; sleep 1; adb shell input keyevent 23; sleep 3
            adb shell input keyevent 23; sleep 20
            adb exec-out screencap -p > p_home.png
            bash scenarios.sh
            (adb shell pidof com.fof.tv > /dev/null && echo RUNNING || echo NOT-RUNNING) | tee alive.txt
            adb logcat -d > logcat.txt
      - name: Check
        if: always()
        run: |
          grep -n -A25 "FATAL EXCEPTION" logcat.txt | grep -A25 "com.fof.tv" | head -60 || true
          grep -E "FofPlay|FofCheck|PlaybackException" logcat.txt | tail -80 || true
          tail -40 fixture.log || true
          # Screens in the log (artifacts are not always reachable): IMG-BEGIN <name> <base64 jpeg> IMG-END
          for f in p_home.png p_tt9000001.png p_tt9000005.png; do
            if [ -s "$f" ]; then
              ffmpeg -loglevel error -y -i "$f" -vf scale=640:-1 -q:v 8 "${f%.png}.jpg"
              echo "IMG-BEGIN ${f%.png}"; base64 -w 0 "${f%.png}.jpg"; echo; echo "IMG-END"
            fi
          done
          python3 .github/scripts/playback_check.py fixture.json logcat.txt
          grep -q RUNNING alive.txt && ! grep -q NOT-RUNNING alive.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-test
          path: |
            p_*.png
            logcat.txt
            fixture.log
            fixture.json
