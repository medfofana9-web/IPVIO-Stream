name: Launch test

# Builds the release APK, installs it on an Android emulator, starts it and checks that it does not crash.
# Saves a screenshot, the start time and the log. Run by hand; "r8" builds with the optimizer turned on.
on:
  push:
    branches: [ launch-test, launch-test-r8 ]
  workflow_dispatch:
    inputs:
      r8:
        description: "Build with the R8 optimizer (1 = on)"
        required: false
        default: "0"

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOF_R8: ${{ github.event.inputs.r8 || (github.ref_name == 'launch-test-r8' && '1' || '0') }}
      FOF_VERSION_CODE: 999999
      FOF_VERSION_NAME: 9.9.9-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          printf 'storeFile=signing/fof-tv.jks\nstorePassword=foftv-sign\nkeyAlias=foftv\nkeyPassword=foftv-sign\n' > keystore.properties
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk app.apk
          ls -la app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell am start -W -n com.fof.tv/com.ipvio.stream.MainActivity | tee start.txt
            sleep 25
            adb exec-out screencap -p > shot1.png
            adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 2; adb shell input keyevent KEYCODE_DPAD_CENTER; sleep 6
            adb exec-out screencap -p > shot2.png
            adb shell am start -n com.fof.tv/com.ipvio.stream.MainActivity --es fof_test_url "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
            sleep 30
            adb exec-out screencap -p > shot3.png
            (adb shell pidof com.fof.tv && echo PLAYING-OK || echo NOT-RUNNING) | tee -a alive.txt
            adb logcat -d | grep -iE "ExoPlayer|PlaybackException|MediaCodec|FATAL" | tail -40 | tee playback.txt
            adb logcat -d > logcat.txt
            (adb shell pidof com.fof.tv && echo RUNNING || echo NOT-RUNNING) | tee alive.txt
      - name: Check for crashes
        run: |
          cat start.txt alive.txt || true
          grep -n -A25 "FATAL EXCEPTION" logcat.txt | head -80 || true
          if grep -q "FATAL EXCEPTION" logcat.txt; then echo "App crashed"; exit 1; fi
          grep -q RUNNING alive.txt && ! grep -q NOT-RUNNING alive.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test
          path: |
            shot1.png
            shot2.png
            shot3.png
            playback.txt
            start.txt
            logcat.txt
