name: Launch test

# Builds the release APK, installs it on an Android emulator, starts it and checks that it does not crash.
# Saves a screenshot, the start time and the log. Run by hand; "r8" builds with the optimizer turned on.
on:
  push:
    branches: [ launch-test, launch-test-r8 ]
  workflow_dispatch:
    inputs:
      r8:
        description: "Build with the R8 optimizer (1 = on)"
        required: false
        default: "0"

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FOF_R8: ${{ github.event.inputs.r8 || (github.ref_name == 'launch-test-r8' && '1' || '0') }}
      FOF_VERSION_CODE: 999999
      FOF_VERSION_NAME: 9.9.9-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          # Test builds use a throwaway key (the real key exists only as a secret of the release workflow)
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storetype PKCS12 -alias t -keyalg RSA -keysize 2048 -validity 2 -storepass testpass -dname CN=test >/dev/null 2>&1
          printf 'storeFile=%s\nstorePassword=testpass\nkeyAlias=t\nkeyPassword=testpass\n' "$RUNNER_TEMP/test.jks" > keystore.properties
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk app.apk
          ls -la app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell am start -W -n com.fof.tv/com.ipvio.stream.MainActivity | tee start.txt
            sleep 25
            adb exec-out screencap -p > shot1.png
            adb shell input keyevent KEYCODE_DPAD_DOWN; sleep 2; adb shell input keyevent KEYCODE_DPAD_CENTER; sleep 6
            adb exec-out screencap -p > shot2.png
            adb shell am start -n com.fof.tv/com.ipvio.stream.MainActivity --es fof_test_url "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
            sleep 30
            adb exec-out screencap -p > shot3.png
            (adb shell pidof com.fof.tv && echo PLAYING-OK || echo NOT-RUNNING) | tee -a alive.txt
            adb logcat -d | grep -iE "ExoPlayer|PlaybackException|MediaCodec|FATAL" | tail -40 | tee playback.txt
            adb logcat -d > logcat.txt
            (adb shell pidof com.fof.tv && echo RUNNING || echo NOT-RUNNING) | tee alive.txt
      - name: Check for crashes
        run: |
          cat start.txt alive.txt || true
          grep -n -A25 "FATAL EXCEPTION" logcat.txt | head -80 || true
          if grep -q "FATAL EXCEPTION" logcat.txt; then echo "App crashed"; exit 1; fi
          grep -q RUNNING alive.txt && ! grep -q NOT-RUNNING alive.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test
          path: |
            shot1.png
            shot2.png
            shot3.png
            playback.txt
            start.txt
            logcat.txt

  # Sports start fixture: OK on tonight's live NBA game against a synthetic provider playlist (dead first feed, right
  # feed, team channel, a feed of another game). Measures OK -> first frame and checks the right feed played.
  # Emulator timings only; they do not stand in for the onn 4K or a Fire TV Stick.
  sports-start:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FOF_R8: "1"
      FOF_VERSION_CODE: 999999
      FOF_VERSION_NAME: 9.9.9-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storetype PKCS12 -alias t -keyalg RSA -keysize 2048 -validity 2 -storepass testpass -dname CN=test >/dev/null 2>&1
          printf 'storeFile=%s\nstorePassword=testpass\nkeyAlias=t\nkeyPassword=testpass\n' "$RUNNER_TEMP/test.jks" > keystore.properties
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/*.apk app.apk
      - name: Synthetic provider (playlist, live TS stream, hanging feed)
        run: |
          mkdir -p srv/live
          which ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440 -t 180 \
            -c:v libx264 -preset veryfast -g 30 -pix_fmt yuv420p -c:a aac -f mpegts srv/live/good.ts
          python3 .github/scripts/sports_fixture.py
          (cd srv && nohup python3 -m http.server 8000 >/dev/null 2>&1 &)
          nohup python3 .github/scripts/hang_server.py >/dev/null 2>&1 &
          sleep 2; curl -s -o /dev/null -w "playlist %{http_code}\n" http://127.0.0.1:8000/test.m3u
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: OK on the live game, twice
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          disable-animations: true
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            adb root || true; sleep 2; adb wait-for-device
            adb shell setprop persist.sys.timezone America/New_York || true
            adb shell service call alarm 3 s16 America/New_York >/dev/null || true
            adb install -r app.apk
            adb logcat -c
            adb shell am start -W -n com.fof.tv/com.ipvio.stream.MainActivity --es fof_test_playlist http://10.0.2.2:8000/test.m3u
            sleep 45
            adb shell input keyevent 23; sleep 3; adb shell input keyevent 4; sleep 2
            adb shell input keyevent 20; sleep 1; adb shell input keyevent 23; sleep 3
            adb shell input keyevent 23; sleep 20
            adb exec-out screencap -p > s_home.png
            adb shell am broadcast -a com.fof.tv.TAB --es sport NBA
            sleep 30
            adb exec-out screencap -p > s_play1.png
            adb shell input keyevent 4; sleep 6
            adb shell am broadcast -a com.fof.tv.TAB --es sport NBA
            sleep 30
            adb exec-out screencap -p > s_play2.png
            adb shell input keyevent 4; sleep 4
            adb shell am broadcast -a com.fof.tv.TAB --ei tab 10 --ei hubtab 7
            sleep 12
            adb exec-out screencap -p > s_channels.png
            adb shell input keyevent 20; sleep 2
            adb exec-out screencap -p > s_channels_focus.png
            (adb shell pidof com.fof.tv > /dev/null && echo RUNNING || echo NOT-RUNNING) | tee alive.txt
            adb logcat -d > logcat.txt
      - name: Checks
        if: always()
        run: |
          grep -n -A25 "FATAL EXCEPTION" logcat.txt | grep -A25 "com.fof.tv" | head -60 || true
          grep -E "FofStart|com.fof.tv.*(Exception|Error)|ExoPlayerImpl|PlaybackException" logcat.txt | tail -60 || true
          python3 .github/scripts/sports_check.py srv/fixture.json logcat.txt
          grep -q RUNNING alive.txt && ! grep -q NOT-RUNNING alive.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-start
          path: |
            s_*.png
            logcat.txt
            srv/fixture.json
