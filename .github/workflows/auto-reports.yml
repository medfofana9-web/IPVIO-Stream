name: Auto problem reports

# Every hour: new problem reports from the TVs (Supabase fof_reports) become GitHub issues labeled "auto-report".
# Needs the repository secret FOF_SUPABASE_SERVICE_KEY (added by the owner in GitHub settings).
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'How many hours back to read'
        default: '2'
      dry_run:
        description: 'Print the issues instead of writing them (1 = yes)'
        default: '0'
      retrace_test:
        description: 'Only test retracing: "<version>|<raw frames>"'
        default: ''

permissions:
  issues: write
  contents: read
  # The R8 mapping of each release (artifact of release.yml) turns raw stack frames back into source lines
  actions: read

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reports to issues
        env:
          FOF_SUPABASE_SERVICE_KEY: ${{ secrets.FOF_SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOOKBACK_HOURS: ${{ github.event.inputs.hours || '2' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          RETRACE_TEST: ${{ github.event.inputs.retrace_test || '' }}
        run: python3 tools/auto_reports.py
