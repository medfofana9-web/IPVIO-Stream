<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<title>Fof TV · Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070c;--s1:#101018;--s2:#171722;--line:#ffffff14;--line2:#ffffff26;--tx:#f4f4f8;--mut:#a3a3b5;--dim:#6c6c80;--ac:#7c5cff;--ac2:#a78bfa;--ok:#2ecc8f;--bad:#ff5d6c;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1200px 600px at 85% -10%,#2a1d6b55,transparent 60%),radial-gradient(900px 500px at -10% 110%,#1d3a6b33,transparent 60%),var(--bg);background-attachment:fixed}
a{color:var(--ac2);text-decoration:none}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:28px 22px 80px}
header{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.5px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#8b6dff,#4b2bd6);display:grid;place-items:center;box-shadow:0 6px 24px #6d4cff55}
.logo i:after{content:"";border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.logo small{font-size:12px;color:var(--mut);font-weight:600;margin-left:2px;letter-spacing:1px}
.sp{flex:1}
.btn{border:1px solid var(--line2);background:#ffffff0d;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:#ffffff1f}
.btn.pri{background:var(--tx);color:#0a0a10;border-color:transparent}
.btn.pri:hover{background:#fff}
.btn.ac{background:var(--ac);border-color:transparent;color:#fff}
.btn.bad{color:var(--bad);border-color:#ff5d6c55}
.btn.sm{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
h1{font-size:40px;font-weight:800;letter-spacing:-1.2px;line-height:1.1}
h2{font-size:22px;font-weight:700;letter-spacing:-.4px;margin-bottom:14px}
h3{font-size:15px;font-weight:600;color:var(--mut);margin:22px 0 10px}
p.lead{color:var(--mut);font-size:16px;margin-top:10px;line-height:1.5}
.card{background:linear-gradient(180deg,#ffffff0c,#ffffff05);border:1px solid var(--line);border-radius:var(--r);padding:22px;backdrop-filter:blur(14px)}
.grid{display:grid;gap:14px}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=tel]{width:100%;background:#0c0c14;border:1px solid var(--line2);border-radius:12px;padding:13px 14px;font-size:15px;outline:none;transition:.15s}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px #7c5cff33}
.err{color:var(--bad);font-size:14px;margin:8px 0}
.note{color:var(--mut);font-size:13px;line-height:1.5}
.center{max-width:420px;margin:8vh auto 0}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px;margin-top:30px}
.pf{cursor:pointer;text-align:center;transition:.18s}
.pf:hover{transform:translateY(-3px)}
.av{aspect-ratio:1;border-radius:22%;overflow:hidden;position:relative;display:grid;place-items:center;font-size:56px;font-weight:800;color:#fff;background:#222;box-shadow:0 10px 30px #0008;border:2px solid transparent;transition:.18s}
.pf:hover .av{border-color:#fff}
.av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.av .lock{position:absolute;right:8px;bottom:8px;background:#000a;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:14px}
.pf b{display:block;margin-top:12px;font-size:16px;font-weight:600}
.pf.add .av{background:#ffffff08;border:2px dashed var(--line2);font-size:46px;color:var(--mut);box-shadow:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 22px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{padding:9px 15px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;font-size:14px}
.tab.on{background:var(--tx);color:#0a0a10}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:9px 15px;border-radius:999px;border:1px solid var(--line2);background:#ffffff08;cursor:pointer;font-weight:600;font-size:14px;transition:.12s;user-select:none}
.chip:hover{background:#ffffff14}
.chip.on{background:var(--tx);color:#0a0a10;border-color:transparent}
.chip.love{background:linear-gradient(135deg,#ff5f8a,#ff3d6e);color:#fff;border-color:transparent}
.chip.no{background:#2a1418;color:#ff8d98;border-color:#ff5d6c44;text-decoration:line-through}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.po{position:relative;cursor:pointer;border-radius:12px;overflow:hidden;aspect-ratio:2/3;background:#1a1a24;border:2px solid transparent;transition:.15s}
.po img{width:100%;height:100%;object-fit:cover;display:block}
.po .t{position:absolute;inset:auto 0 0 0;padding:26px 8px 8px;font-size:12px;font-weight:600;background:linear-gradient(transparent,#000d)}
.po .badge{position:absolute;top:7px;right:7px;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800}
.po.liked{border-color:#fff}.po.liked .badge{background:#fff;color:#000}
.po.loved{border-color:#ff4f7b}.po.loved .badge{background:#ff4f7b;color:#fff}
.po.nope{opacity:.35}.po.nope .badge{background:#000;color:#fff}
.list{display:grid;gap:10px}
.li{display:flex;align-items:center;gap:14px;padding:10px;border-radius:12px;background:#ffffff06;border:1px solid var(--line)}
.li img{width:46px;height:68px;object-fit:cover;border-radius:8px;background:#222}
.li .g{flex:1;min-width:0}
.li .g b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .g small{color:var(--mut);font-size:13px}
.bar{height:4px;background:#ffffff1a;border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tm{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#ffffff06;cursor:pointer;font-size:13px;font-weight:600}
.tm img{width:30px;height:30px;object-fit:contain}
.tm.on{background:var(--tx);color:#0a0a10}
.q{margin-bottom:18px}.q .note{margin-bottom:8px;font-weight:600;color:var(--tx);font-size:14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border:0}
.tg{width:48px;height:28px;border-radius:999px;background:#ffffff26;position:relative;cursor:pointer;flex:none;transition:.15s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--ok)}.tg.on:after{left:23px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:#0a0a10;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 10px 40px #000a;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:8;padding:20px}
.modal .card{width:100%;max-width:440px;background:#11111a}
.steps{display:flex;gap:6px;margin:6px 0 22px}.steps i{flex:1;height:4px;border-radius:4px;background:#ffffff1a}.steps i.on{background:var(--ac2)}
.foot{display:flex;gap:10px;justify-content:space-between;margin-top:24px;flex-wrap:wrap}
.muted{color:var(--mut)}
@media(max-width:600px){h1{font-size:30px}.wrap{padding:20px 16px 70px}.profiles{grid-template-columns:repeat(2,1fr)}}

:root{--bg:#09090c;--s1:#141419;--s2:#1b1b22;--ac:#c52d45;--ac2:#ff8798}
body{background:radial-gradient(900px 420px at 88% 0%,#53182744,transparent 65%),var(--bg)}
.logo i{background:linear-gradient(135deg,#ef4d65,#9e1832);box-shadow:0 6px 24px #ad2d4144}
#hdr{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#hdr [aria-current="page"]{border-color:var(--ac2);color:var(--ac2)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac2);outline-offset:3px}
input:focus{box-shadow:0 0 0 3px #c52d4544}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}
.settings-grid .card{min-width:0;backdrop-filter:none}
.settings-wide{grid-column:1/-1}
.settings-grid form{margin-top:16px}
.settings-grid .list{margin-top:20px}
.setting-status{margin-top:10px;color:var(--mut);font-size:14px}
.settings-link{margin-top:18px;display:inline-block}
@media(max-width:680px){.settings-grid{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo"><i></i>fof<small>TV</small></div><div class="sp"></div><div id="hdr"></div></header>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// Fof TV account website. Same account service as the TVs: everything is protected per account by row level security,
// so this public key only reaches what the signed-in person may see. Changes reach the TVs by themselves.
const SB = "https://msooylkizqvdrgxrdjww.supabase.co";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zb295bGtpenF2ZHJneHJkand3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3MTAzMTksImV4cCI6MjExMDI4NjMxOX0.PBF00osXJngq78z74Q2jVKFkc5yvJ41z9d7E0jJjryo";
const CM = "https://v3-cinemeta.strem.io";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TILE = ["#2D5BE3","#C0392B","#13A26B","#7C4DFF","#E07A1F","#0E9AA7","#D6336C","#3F3D9E"];
const MOVIE_GENRES = ["Action","Comedy","Thriller","Drama","Crime","Horror","Sci-Fi","Adventure","Animation","Family","Romance","Mystery","Fantasy","Documentary"];
const SERIES_GENRES = ["Reality-TV"];
const ALL_GENRES = [...MOVIE_GENRES, ...SERIES_GENRES];
const PREF_Q = [["mix","Movies or shows?",["Mostly movies","Both","Mostly shows"]],["mood","Your mood",["Make me laugh","A bit of both","Serious drama"]],
 ["tone","Dark or light?",["Dark and gritty","Either","Light and feel-good"]],["story","How stories run",["One long story","Either","Episodes that stand alone"]],
 ["pace","Story pace",["Fast and exciting","Either","Slow burn"]],["world","Kind of world",["Real life","Either","Fantasy and sci-fi"]],
 ["docs","Documentaries",["Love documentaries","Sometimes","Rarely"]],["reality","Reality TV",["Love reality TV","Sometimes","Not for me"]],
 ["subs","Other languages",["Subtitles are fine","English audio only"]],["lang","Preferred language",["English","Spanish","Any language"]],
 ["length","Episode length",["Short episodes","Any length","Long episodes"]]];
const SPORTS = [["nfl","NFL"],["nba","NBA"],["wnba","WNBA"],["cfb","College Football"],["cbb","College Basketball"],["soccer","Soccer"]];
const TEAM_LEAGUES = {nfl:[["NFL","football/nfl"]],nba:[["NBA","basketball/nba"]],wnba:[["WNBA","basketball/wnba"]],
  soccer:[["Premier League","soccer/eng.1"],["MLS","soccer/usa.1"],["LaLiga","soccer/esp.1"],["Liga MX","soccer/mex.1"]]};

let S = JSON.parse(localStorage.getItem("fof_web_s") || "null");
const devId = localStorage.getItem("fof_web_dev") || (() => { const v = crypto.randomUUID(); localStorage.setItem("fof_web_dev", v); return v; })();
let state = { profiles: [], pins: {}, cur: null, tab: "taste" };

function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 2600); }
function saveS() { if (S) localStorage.setItem("fof_web_s", JSON.stringify(S)); else localStorage.removeItem("fof_web_s"); }

async function auth(path, body) {
  const r = await fetch(SB + "/auth/v1/" + path, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || ("Error " + r.status));
  return j;
}
function keep(j) { S = { a: j.access_token, r: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000, email: j.user?.email, uid: j.user?.id }; saveS(); }
async function token() {
  if (!S) throw new Error("signed out");
  if (Date.now() > S.exp - 60000) {
    try { keep(await auth("token?grant_type=refresh_token", { refresh_token: S.r })); }
    catch (e) { S = null; saveS(); render(); throw e; }
  }
  return S.a;
}
async function api(method, path, body, prefer) {
  const h = { apikey: KEY, Authorization: "Bearer " + await token(), "Content-Type": "application/json" };
  if (prefer) h.Prefer = prefer;
  const r = await fetch(SB + path, { method, headers: h, body: body == null ? undefined : JSON.stringify(body) });
  const t = await r.text();
  if (!r.ok) throw new Error(t || ("Error " + r.status));
  return t ? JSON.parse(t) : null;
}
const rpc = (fn, args) => api("POST", "/rest/v1/rpc/" + fn, args || {});

// ---------- profile data (same format as the TVs: { store: { key: [type, value] } })
const enc = v => typeof v === "boolean" ? ["b", v] : Array.isArray(v) ? ["t", v] : typeof v === "number" ? ["l", v] : ["s", String(v)];
const dec = a => Array.isArray(a) ? a[1] : undefined;
const str = (files, store, key) => dec(files?.[store]?.[key]) ?? "";
const split = (s, d = "|") => String(s || "").split(d).filter(Boolean);

async function readData(pid) {
  const r = await api("GET", "/rest/v1/fof_profile_data?select=data,updated_at&profile_id=eq." + pid);
  return r && r[0] ? { files: r[0].data?.files || {}, at: r[0].updated_at } : { files: {}, at: null };
}
// Saves only over the version just read; if a TV saved in between, read again and apply the change again (nothing is lost).
async function saveData(pid, mutate) {
  for (let i = 0; i < 4; i++) {
    const { files, at } = await readData(pid);
    mutate(files);
    const data = { v: 1, files };
    if (at) {
      const r = await api("PATCH", "/rest/v1/fof_profile_data?profile_id=eq." + pid + "&updated_at=eq." + encodeURIComponent(at), { data }, "return=representation");
      if (r && r.length) return files;
    } else {
      await api("POST", "/rest/v1/fof_profile_data?on_conflict=profile_id", { profile_id: pid, data }, "resolution=merge-duplicates,return=minimal");
      return files;
    }
  }
  throw new Error("Busy, try again");
}

// ---------- screens
function render() {
  const nav = [["home", "Profiles"], ["settings", "TV setup"], ["account", "Account"]];
  const current = state.view === "profile" ? "home" : (state.view || "home");
  $("#hdr").innerHTML = S ? nav.map(([key, label]) =>
    `<button class="btn sm" ${current === key ? 'aria-current="page"' : ""} onclick="go('${key}')">${label}</button>`).join("") : "";
  if (!S) return signInView();
  if (state.view === "settings") return settingsView();
  if (state.view === "account") return accountView();
  if (state.view === "profile" && state.cur) return profileView();
  return homeView();
}
function go(v) { state.view = v; render(); window.scrollTo(0, 0); }

function signInView() {
  $("#app").innerHTML = `<div class="center card">
    <h2>Sign in to Fof TV</h2><p class="note" style="margin-bottom:18px">Use the same email and password as on your TV. Changes here show up on every TV signed in to this account.</p>
    <label class="field"><span>Email</span><input type="email" id="em" autocomplete="username"></label>
    <label class="field"><span>Password</span><input type="password" id="pw" autocomplete="current-password"></label>
    <div class="err" id="er"></div>
    <button class="btn pri" style="width:100%" id="go">Sign in</button></div>`;
  const doIt = async () => {
    $("#er").textContent = ""; $("#go").disabled = true;
    try {
      keep(await auth("token?grant_type=password", { email: $("#em").value.trim(), password: $("#pw").value }));
      await rpc("fof_register_device", { p_id: devId, p_name: "Website", p_kind: "Web browser", p_version: "web-1" }).catch(() => {});
      state.view = "home"; await loadProfiles(); render();
    } catch (e) { $("#er").textContent = /invalid/i.test(e.message) ? "Wrong email or password." : e.message; }
    $("#go").disabled = false;
  };
  $("#go").onclick = doIt; $("#pw").onkeydown = e => { if (e.key === "Enter") doIt(); };
}

async function loadProfiles() {
  state.profiles = (await api("GET", "/rest/v1/fof_profiles?select=id,slot,name,avatar,photo&deleted=eq.false&order=slot")) || [];
  const st = (await rpc("fof_pin_status").catch(() => [])) || [];
  state.pins = Object.fromEntries(st.map(x => [x.profile_id, x]));
}
function avatarHtml(p) {
  const a = p.avatar || "";
  let img = "";
  if (a.startsWith("img:")) img = a.slice(4).split("|")[0];
  else if (a.startsWith("photo:") && p.photo) img = "data:image/jpeg;base64," + p.photo;
  const lock = state.pins[p.id]?.pin_set ? `<span class="lock">🔒</span>` : "";
  return `<div class="av" style="background:${TILE[p.slot % TILE.length]}">${img ? `<img src="${esc(img)}" alt="">` : esc((p.name || "?").trim().charAt(0).toUpperCase())}${lock}</div>`;
}
async function homeView() {
  $("#app").innerHTML = `<h1>Who's watching?</h1><p class="lead">Pick a profile to change its name, picture, PIN, tastes, lists and teams.</p><div class="profiles" id="pl"><p class="muted">Loading…</p></div>`;
  try { await loadProfiles(); } catch (e) { $("#pl").innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  $("#pl").innerHTML = state.profiles.map(p => `<div class="pf" onclick="openProfile('${p.id}')">${avatarHtml(p)}<b>${esc(p.name || "Profile")}</b></div>`).join("") +
    (state.profiles.length < 10 ? `<div class="pf add" onclick="addProfile()"><div class="av">+</div><b>Add profile</b></div>` : "");
}

function modal(html) { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="card">${html}</div>`; m.onclick = e => { if (e.target === m) m.remove(); }; document.body.appendChild(m); return m; }

function addProfile() {
  const m = modal(`<h2>New profile</h2><label class="field"><span>Name</span><input type="text" id="nn" maxlength="40"></label><div class="err" id="ne"></div>
    <div class="row"><button class="btn pri" id="ok">Create</button><button class="btn" onclick="this.closest('.modal').remove()">Cancel</button></div>`);
  m.querySelector("#nn").focus();
  m.querySelector("#ok").onclick = async () => {
    const name = m.querySelector("#nn").value.trim(); if (!name) return;
    const used = new Set(state.profiles.map(p => p.slot)); let slot = 0; while (used.has(slot)) slot++;
    try {
      const r = await api("POST", "/rest/v1/fof_profiles", { slot, name, avatar: "" }, "return=representation");
      m.remove(); toast("Profile created. Your TVs add it within 2 minutes."); await loadProfiles(); openProfile(r[0].id, "taste");
    } catch (e) { m.querySelector("#ne").textContent = /up to 10/.test(e.message) ? "An account can have up to 10 profiles." : e.message; }
  };
}

async function openProfile(id, tab) {
  const p = state.profiles.find(x => x.id === id); if (!p) return;
  const ps = state.pins[id];
  if (ps?.pin_set && !ps.unlocked) {
    const m = modal(`<h2>${esc(p.name)}</h2><p class="note">Enter this profile's PIN.</p><label class="field" style="margin-top:14px"><input type="tel" id="pin" maxlength="6" inputmode="numeric" autocomplete="off"></label><div class="err" id="pe"></div><button class="btn pri" id="ok">Open</button>`);
    const inp = m.querySelector("#pin"); inp.focus();
    const tryIt = async () => {
      const r = await rpc("fof_verify_pin", { p_profile: id, p_pin: inp.value.trim() });
      if (r?.ok) { ps.unlocked = true; m.remove(); openProfile(id, tab); }
      else m.querySelector("#pe").textContent = r?.err === "locked" ? `Too many tries. Wait ${r.wait_s || 60} seconds.` : "Wrong PIN.";
    };
    m.querySelector("#ok").onclick = tryIt; inp.onkeydown = e => { if (e.key === "Enter") tryIt(); };
    return;
  }
  state.cur = p; state.tab = tab || state.tab || "taste"; state.view = "profile"; render(); window.scrollTo(0, 0);
}

const TABS = [["taste","Preferences"],["lists","My List"],["resume","Continue Watching"],["sports","Sports"],["profile","Name & picture"],["security","PIN & Kids"]];
async function profileView() {
  const p = state.cur;
  $("#app").innerHTML = `<div class="row" style="gap:18px"><div style="width:84px">${avatarHtml(p)}</div><div><h1>${esc(p.name)}</h1><p class="lead" style="margin-top:4px">Changes save right away and reach this profile on every TV.</p></div></div>

const metaCache = {};
async function cmList(type, cat, q) {
  const k = type + cat + (q || "");
  if (metaCache[k]) return metaCache[k];
  const url = CM + "/catalog/" + type + "/" + cat + (q ? "/search=" + encodeURIComponent(q) : "") + ".json";
  const j = await fetch(url).then(r => r.json()).catch(() => ({ metas: [] }));
  const l = (j.metas || []).filter(m => m.imdb_id || m.id).map(m => {
    const it = { i: "stremio:" + (m.imdb_id || m.id), t: m.name, s: type === "series", y: parseInt(m.releaseInfo || m.year) || undefined, p: m.poster || null };
    T && (T.items[it.i] = it); return it;
  });
  return metaCache[k] = l;
}
async function saveTaste() {
  const b = $("#next"); b.disabled = true; b.textContent = "Saving…";
  const gb = k => Object.entries(T.genres).filter(([, v]) => v === k).map(([n]) => n);
  const tb = k => Object.entries(T.titles).filter(([, v]) => v === k).map(([n]) => n);
  try {
    await saveData(state.cur.id, files => {
      const t = files.fof_taste = files.fof_taste || {};
      delete t.draft;
      t.done = enc(true);
      t.genres = enc([...gb(1), ...gb(2)].join("|")); t.glove = enc(gb(1).join("|")); t.gno = enc(gb(3).join("|"));
      t.tg = enc([...gb(1), ...gb(2)].join("|"));
      t.titles = enc([...tb(1), ...tb(2)].join("|")); t.loved = enc(tb(1).join("|")); t.nope = enc(tb(3).join("|"));
      for (const k of Object.keys(t)) if (k.startsWith("p_")) delete t[k];
      for (const [k, v] of Object.entries(T.prefs)) t["p_" + k] = enc(v);
      // The liked titles themselves, so every TV can show them (kept newest 400)
      let items = []; try { items = JSON.parse(str(files, "fof_catalog_items", "a") || "[]"); } catch {}
      const have = new Set(items.map(o => o.i));
      for (const i of [...tb(1), ...tb(2)]) if (!have.has(i) && T.items[i]) { const o = T.items[i]; items.push({ i: o.i, t: o.t, s: !!o.s, ...(o.y ? { y: o.y } : {}), ...(o.p ? { p: o.p } : {}) }); }
      files.fof_catalog_items = { ...(files.fof_catalog_items || {}), a: enc(JSON.stringify(items.slice(-400))) };
    });
    toast("Saved. Your TV's Home updates within a few seconds.");
    render();
  } catch (e) { toast(e.message); b.disabled = false; b.textContent = "Save to my profile"; }
}

// Sensitive changes need the password again after 10 minutes (same rule as the TV)
function reauth() {
  return new Promise(res => {
    const m = modal(`<h2>Confirm it's you</h2><p class="note">Enter your account password.</p><label class="field" style="margin-top:14px"><input type="password" id="rp" autocomplete="current-password"></label><div class="err" id="re"></div><button class="btn pri" id="ok">Confirm</button>`);
    m.querySelector("#rp").focus();
    m.querySelector("#ok").onclick = async () => {
      try { keep(await auth("token?grant_type=password", { email: S.email, password: m.querySelector("#rp").value })); m.remove(); res(true); }
      catch { m.querySelector("#re").textContent = "Wrong password."; }
    };
  });
}

// ---------- Account

function sourceUrl(raw, addon = false) {
  const input = raw.trim();
  const url = new URL(addon ? input.replace(/^stremio:\/\//i, "https://") : input);
  if (!["https:", "http:"].includes(url.protocol) || !url.hostname || url.username || url.password || url.hash) {
    throw new Error("Use a web address without embedded login details or a fragment.");
  }
  if (!addon) return url.href;
  if (url.protocol !== "https:" || url.search) throw new Error("Use an HTTPS add-on base or manifest address without a query string.");
  const path = url.pathname.replace(/\/+$/, "").replace(/\/manifest\.json$/i, "");
  return url.origin + path;
}

function sourceList(rows) {
  const raw = rows.find(row => row.name === "addons")?.value;
  const addons = raw ? JSON.parse(raw) : [];
  if (!Array.isArray(addons) || addons.some(addon => typeof addon !== "string")) {
    throw new Error("The account returned an unreadable add-on list.");
  }
  return addons;
}

function sourceLabel(address) {
  try { return new URL(address).hostname || "Add-on"; } catch { return "Add-on"; }
}

async function settingsView() {
  const user = S.uid;
  const app = $("#app");
  app.innerHTML = `<h1>TV setup</h1>
    <p class="lead">Manage the sources used by FOF TV devices signed in to this account.</p>
    <div class="settings-grid" id="setup">
      <section class="card settings-wide">
        <h2>Stremio add-ons</h2>
        <p class="note">Paste an add-on’s manifest link or base address. Your TV checks compatibility during its next sync.</p>
        <form id="add-addon"><label class="field"><span>Add-on address</span><input name="address" type="password" required autocomplete="off" placeholder="https://provider.example/manifest.json"></label>
        <button class="btn pri" disabled>Add add-on</button></form>
        <div class="list" id="source-list"><p class="muted">Loading add-ons…</p></div>
      </section>
      <section class="card">
        <h2>Playlist</h2>
        <p class="note">Set an M3U playlist address for your TVs. Saving replaces the synced playlist.</p>
        <p class="setting-status" id="playlist-status"></p>
        <form id="set-playlist"><label class="field"><span>M3U URL</span><input name="address" type="password" required autocomplete="off"></label>
        <button class="btn pri" disabled>Save playlist</button></form>
      </section>
      <section class="card">
        <h2>Real-Debrid</h2>
        <p class="note">Connect your own account with an API token. FOF TV checks it on your TV.</p>
        <p class="setting-status" id="debrid-status"></p>
        <form id="set-debrid"><label class="field"><span>API token</span><input name="token" type="password" required autocomplete="off"></label>
        <button class="btn pri" disabled>Save token</button> <button class="btn bad" type="button" id="clear-debrid" disabled>Disconnect</button></form>
      </section>
    </div>
    <p class="err" id="setup-error" role="alert"></p>
    <button class="btn settings-link" type="button" onclick="go('account')">Manage signed-in devices</button>`;
  const panel = $("#setup");
  const error = $("#setup-error");
  const active = () => panel.isConnected && S?.uid === user && state.view === "settings";
  function show(rows) {
    const list = panel.querySelector("#source-list");
    const addons = sourceList(rows);
    const playlist = rows.some(row => row.name === "playlist" && row.value);
    const debrid = rows.some(row => row.name === "debrid" && row.value);
    panel.querySelector("#playlist-status").textContent = playlist ? "Playlist saved" : "No playlist saved";
    panel.querySelector("#debrid-status").textContent = debrid ? "Token saved" : "No token saved";
    list.innerHTML = addons.map(address => `<div class="li"><div class="g"><b>${esc(sourceLabel(address))}</b></div><button type="button" class="btn sm bad">Remove</button></div>`).join("") || '<p class="muted">No add-ons saved.</p>';
    list.querySelectorAll("button").forEach((button, index) => {
      const address = addons[index];
      button.onclick = () => {
        if (!confirm("Remove " + sourceLabel(address) + " from this account?")) return;
        write(async () => {
          const fresh = sourceList(await rpc("fof_secrets_get"));
          return ["addons", JSON.stringify(fresh.filter(value => value !== address))];
        });
      };
    });
    panel.querySelectorAll("button").forEach(button => button.disabled = false);
    panel.querySelector("#clear-debrid").disabled = !debrid;
  }

  let busy = false;
  async function write(change, form) {
    if (busy || !active()) return;
    busy = true;
    error.textContent = "";
    const buttons = [...panel.querySelectorAll("button:not(:disabled)")];
    buttons.forEach(button => button.disabled = true);
    let saved = false;
    try {
      const [name, value] = await change();
      if (!active()) return;
      await rpc("fof_secret_put", { p_name: name, p_value: value });
      saved = true;
      if (!active()) return;
      form?.reset();
      toast("Saved to your FOF TV account.");
      const rows = await rpc("fof_secrets_get");
      if (active()) show(rows);
    } catch (e) {
      if (active()) error.textContent = saved ? "Saved. Reopen TV setup to refresh the list." : (e.userMessage || "Could not save. Check your address and try again.");
    } finally {
      if (active() && !saved) buttons.forEach(button => button.disabled = false);
      busy = false;
    }
  }

  function bind(id, change) {
    const form = panel.querySelector(id);
    form.onsubmit = event => {
      event.preventDefault();
      const fields = new FormData(form);
      write(() => change(fields), form);
    };
  }
  bind("#add-addon", async fields => {
    const value = sourceUrl(fields.get("address"), true);
    const fresh = sourceList(await rpc("fof_secrets_get"));
    if (fresh.some(address => address.toLowerCase() === value.toLowerCase())) {
      const error = new Error();
      error.userMessage = "This add-on is already saved.";
      throw error;
    }
    return ["addons", JSON.stringify([...fresh, value])];
  });
  bind("#set-playlist", fields => ["playlist", sourceUrl(fields.get("address"))]);
  bind("#set-debrid", fields => {
    const token = fields.get("token").trim();
    if (!token || /\s/.test(token)) throw new Error("Invalid token");
    return ["debrid", token];
  });
  panel.querySelector("#clear-debrid").onclick = () => {
    if (confirm("Disconnect Real-Debrid from this FOF TV account?")) write(() => ["debrid", ""]);
  };

  try {
    const rows = await rpc("fof_secrets_get");
    if (active()) show(rows);
  } catch {
    if (active()) {
      panel.querySelector("#source-list").textContent = "Add-ons unavailable.";
      error.textContent = "Could not load TV setup. Reopen this page to try again.";
    }
  }
}

async function accountView() {
  $("#app").innerHTML = `<h1>Account</h1><p class="lead">${esc(S.email || "")}</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:26px">
    <div class="card"><h2>TVs and devices</h2><div class="list" id="dv"><p class="muted">Loading…</p></div></div>
    <div class="card"><h2>Password</h2><label class="field"><span>New password (8+ characters)</span><input type="password" id="np" autocomplete="new-password"></label><div class="err" id="ae"></div>
      <button class="btn pri" id="cp">Change password</button><h3>This website</h3><button class="btn bad" id="so">Sign out here</button></div></div>`;
  const devs = await api("GET", "/rest/v1/fof_devices?select=id,name,kind,app_version,last_seen,revoked&order=last_seen.desc").catch(() => []);
  $("#dv").innerHTML = (devs || []).filter(d => !d.revoked).map(d => `<div class="li"><div class="g"><b>${esc(d.name || d.kind)}${d.id === devId ? " (this website)" : ""}</b><small>${esc(d.kind)} · ${esc(d.app_version)} · last used ${new Date(d.last_seen).toLocaleString()}</small></div>${d.id === devId ? "" : `<button class="btn sm bad" onclick="revoke('${d.id}')">Sign out</button>`}</div>`).join("") || `<p class="muted">None.</p>`;
  $("#cp").onclick = async () => {
    const np = $("#np").value; if (np.length < 8) return $("#ae").textContent = "Use at least 8 characters.";
    try { await api("PUT", "/auth/v1/user", { password: np }); toast("Password changed. TVs stay signed in."); $("#np").value = ""; }
    catch (e) { if (/reauth|recent/i.test(e.message) && await reauth()) { await api("PUT", "/auth/v1/user", { password: np }); toast("Password changed."); } else $("#ae").textContent = e.message; }
  };
  $("#so").onclick = async () => { await api("POST", "/auth/v1/logout", {}).catch(() => {}); S = null; saveS(); render(); };
}
async function revoke(id) { if (!confirm("Sign this TV out of the account?")) return; await rpc("fof_revoke_device", { p_id: id }); toast("Signed out. That TV asks to sign in again."); accountView(); }

render();
if (S) loadProfiles().then(render).catch(() => {});
</script>
